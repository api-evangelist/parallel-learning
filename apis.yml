aid: parallel-learning
name: Parallel Learning
description: Parallel Learning is a special education services and staffing platform that connects K-12
  schools and districts with a nationwide network of licensed clinicians for the remote delivery of specialized
  student support. Through its proprietary, HIPAA/FERPA-compliant Pathway platform it delivers virtual
  psychoeducational and neurodevelopmental assessments, speech-language therapy, behavioral and mental-health
  counseling, specialized instruction in reading, writing, and math, and executive-function coaching, pairing
  secure teletherapy with progress tracking and clinical oversight so districts can meet compliance requirements
  and improve student outcomes. The company serves thousands of students across dozens of states and does
  not currently publish a public developer API, SDK, or API documentation surface.
